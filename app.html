<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Database v1.0.2</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="app">
 <header class="toolbar" aria-label="Prompt controls">
  <button class="icon" id="add" aria-label="Add prompt" title="Add prompt" data-icon="plus"></button>
  <form class="search" id="search-form" role="search"><input id="search" aria-label="Search by name" placeholder="Search by name…" autocomplete="off"><button class="icon bare" aria-label="Search" title="Search" data-icon="search"></button></form>
  <span class="divider"></span>
  <div class="menu-wrap"><button id="sort-toggle" class="icon bare" aria-label="Sort prompts" aria-expanded="false" aria-controls="sort-menu" title="Sort prompts" data-icon="list-filter"></button>
   <div class="popover" id="sort-menu" hidden><div class="menu-label">Sort by</div><div id="sort-options"></div><div class="menu-rule"></div><div class="direction"><button data-direction="asc" title="Ascending"><span data-icon="arrow-up"></span>Ascending</button><button data-direction="desc" title="Descending"><span data-icon="arrow-down"></span>Descending</button></div></div>
  </div>
  <button id="settings-open" class="icon bare" aria-label="Settings" title="Settings" data-icon="settings"></button>
 </header>
 <section id="list" class="list" aria-label="Prompts"></section><div id="empty" class="empty" hidden></div>
</main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title">New prompt</h2><button type="button" class="icon bare" data-close aria-label="Close" data-icon="x"></button></div><div class="dialog-body"><div class="field-group"><div class="label-line"><label for="prompt-name">Name</label><span class="hint" id="name-count">0 / 200</span></div><input class="field" id="prompt-name" maxlength="200" required autocomplete="off"></div><div class="field-group"><label for="prompt-content">Content</label><textarea class="field" id="prompt-content" required spellcheck="false"></textarea></div><p class="error" id="editor-error" hidden></p></div><div class="dialog-foot"><button type="button" data-close>Cancel</button><button class="primary" id="save-prompt">Save prompt</button></div></form></dialog>
<dialog id="viewer"><div class="dialog-head"><h2>Prompt</h2><button class="icon bare" data-close aria-label="Close" data-icon="x"></button></div><div class="dialog-body"><div class="copy-line"><label>Name</label><button id="copy-name"><span data-icon="copy"></span>Copy</button></div><div class="preview-title" id="view-name"></div><div class="copy-line" style="margin-top:24px"><label>Content</label><button id="copy-content"><span data-icon="copy"></span>Copy</button></div><pre class="preview-content" id="view-content"></pre><div class="version"><span id="prompt-version"></span><span id="engine-version"></span></div></div></dialog>
<dialog id="settings"><div class="dialog-head"><h2>Settings</h2><button class="icon bare" data-close aria-label="Close" data-icon="x"></button></div><div class="dialog-body"><div class="setting-row"><label for="content-color">Content color</label><div class="color-field"><input type="color" id="content-color" aria-label="Text and icon color"><input type="text" id="content-hex" aria-label="Content hex color" maxlength="7" pattern="#[0-9a-fA-F]{6}"></div></div><div class="setting-row"><label for="bg-color">Background color</label><div class="color-field"><input type="color" id="bg-color" aria-label="Background color"><input type="text" id="bg-hex" aria-label="Background hex color" maxlength="7" pattern="#[0-9a-fA-F]{6}"></div></div><button id="restore"><span data-icon="rotate-ccw"></span>Restore defaults</button><div class="settings-section"><div class="menu-wrap"><button id="export-toggle" aria-expanded="false" aria-controls="export-menu"><span><span data-icon="download"></span> Export data</span><span data-icon="chevron-down"></span></button><div class="popover" id="export-menu" hidden><button data-export="all">Prompts + settings</button><button data-export="prompts">Prompts</button><button data-export="settings">Settings</button></div></div><div class="menu-wrap"><button id="import-toggle" aria-expanded="false" aria-controls="import-menu"><span><span data-icon="upload"></span> Import data</span><span data-icon="chevron-down"></span></button><div class="popover" id="import-menu" hidden><button data-import="all">Prompts + settings</button><button data-import="prompts">Prompts</button><button data-import="settings">Settings</button></div></div><button id="wipe" class="danger"><span data-icon="trash-2"></span>Wipe all data</button></div><p class="error" id="settings-error" hidden></p></div></dialog>
<dialog id="confirm"><div class="dialog-head"><h2 id="confirm-title"></h2><button class="icon bare" data-close aria-label="Close" data-icon="x"></button></div><div class="dialog-body"><p class="confirm-copy" id="confirm-text"></p><p class="error" id="confirm-error" hidden></p></div><div class="dialog-foot"><button data-close>Cancel</button><button id="confirm-action" class="primary">Delete</button></div></dialog>
<input type="file" accept=".json,application/json" id="import-file" hidden><div class="toast" role="status" id="toast" hidden></div>
<script src="app.js" defer></script>

</body>
</html>
